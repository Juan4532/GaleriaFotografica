<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="dark">
    <meta name="theme-color" content="#000000">
    <title>Portfolio Fotográfico</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="app">
        <!-- Vista principal: galerías -->
        <section id="galeria-principal" class="vista vista-principal activa" aria-labelledby="titulo-portfolio">
            <header class="cabecera">
                <h1 id="titulo-portfolio" class="titulo-portfolio">Portfolio Fotográfico</h1>
            </header>
            <div class="contenedor-galerias">
                <!-- Las galerías se generarán dinámicamente -->
            </div>
        </section>

        <!-- Vista de galería individual -->
        <section id="galeria-individual" class="vista vista-galeria" aria-labelledby="titulo-galeria">
            <header class="cabecera cabecera-galeria">
                <a href="#/" class="btn-volver boton-redondo" aria-label="Volver a las galerías">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                        <path d="M19 12H6m6-7l-7 7 7 7"/>
                    </svg>
                </a>
                <div>
                    <h1 id="titulo-galeria" class="titulo-galeria" tabindex="-1"></h1>
                    <p class="contador-galeria"></p>
                </div>
            </header>
            <div class="contenedor-fotos">
                <!-- Las fotos se generarán dinámicamente -->
            </div>
        </section>

        <!-- Vista de foto completa -->
        <section id="foto-completa" class="vista vista-completa" role="dialog" aria-modal="true" aria-labelledby="info-foto" tabindex="-1">
            <div class="barra-foto">
                <p id="info-foto" class="info-foto" aria-live="polite"><span class="info-titulo"></span> <span class="info-posicion"></span></p>
                <a class="btn-original boton-redondo" target="_blank" rel="noopener" aria-label="Abrir la foto original en una pestaña nueva" title="Ver original">
                    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                        <path d="M14 4h6v6M20 4l-9 9M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/>
                    </svg>
                </a>
                <button type="button" class="btn-cerrar boton-redondo" aria-label="Cerrar (Esc)">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                        <line x1="18" y1="6" x2="6" y2="18"></line>
                        <line x1="6" y1="6" x2="18" y2="18"></line>
                    </svg>
                </button>
            </div>
            <button type="button" class="btn-anterior boton-redondo" aria-label="Foto anterior">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                    <polyline points="15,18 9,12 15,6"></polyline>
                </svg>
            </button>
            <button type="button" class="btn-siguiente boton-redondo" aria-label="Foto siguiente">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                    <polyline points="9,18 15,12 9,6"></polyline>
                </svg>
            </button>
            <div class="contenedor-imagen">
                <img id="imagen-completa" alt="">
                <div class="indicador-carga" aria-hidden="true"></div>
            </div>
        </section>
    </main>

    <script src="galleries.js"></script>
    <script src="app.js"></script>
</body>
</html>

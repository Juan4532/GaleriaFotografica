<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio Fotográfico</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="app">
        <!-- Vista principal: galerías -->
        <div id="galeria-principal" class="vista vista-principal">
            <div class="contenedor-galerias">
                <!-- Las galerías se generarán dinámicamente -->
            </div>
        </div>

        <!-- Vista de galería individual -->
        <div id="galeria-individual" class="vista vista-galeria">
            <div class="controles-navegacion">
                <button class="btn-volver" aria-label="Volver">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M19 12H6m6-7l-7 7 7 7"/>
                    </svg>
                </button>
            </div>
            <div class="contenedor-fotos">
                <!-- Las fotos se generarán dinámicamente -->
            </div>
        </div>

        <!-- Vista de foto completa -->
        <div id="foto-completa" class="vista vista-completa">
            <div class="controles-foto">
                <button class="btn-cerrar" aria-label="Cerrar">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <line x1="18" y1="6" x2="6" y2="18"></line>
                        <line x1="6" y1="6" x2="18" y2="18"></line>
                    </svg>
                </button>
                <button class="btn-anterior" aria-label="Anterior">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <polyline points="15,18 9,12 15,6"></polyline>
                    </svg>
                </button>
                <button class="btn-siguiente" aria-label="Siguiente">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <polyline points="9,18 15,12 9,6"></polyline>
                    </svg>
                </button>
            </div>
            <div class="contenedor-imagen">
                <img id="imagen-completa" src="" alt="">
            </div>
        </div>
    </main>

    <script src="galleries.js"></script>
    <script src="app.js"></script>
</body>
</html>
